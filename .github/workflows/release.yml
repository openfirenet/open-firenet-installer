name: Build and Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: open-firenet-installer
            asset_name: open-firenet-installer-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: open-firenet-installer.exe
            asset_name: open-firenet-installer-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: open-firenet-installer
            asset_name: open-firenet-installer-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: open-firenet-installer
            asset_name: open-firenet-installer-macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev pkg-config

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p release-dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "release-dist/${{ matrix.asset_name }}"
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "release-dist/${{ matrix.asset_name }}"
            chmod +x "release-dist/${{ matrix.asset_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release-dist/${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist

      - name: Flatten directory and compute checksums
        run: |
          cd release-dist
          mv */* . 2>/dev/null || true
          rm -rf open-firenet-installer-*_* 2>/dev/null || true
          sha256sum open-firenet-installer-* > SHA256SUMS
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/open-firenet-installer-*
            release-dist/SHA256SUMS
          generate_release_notes: true
