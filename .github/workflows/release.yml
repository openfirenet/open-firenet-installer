name: Build and Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: open-firenet-installer
            asset_name: open-firenet-installer-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: open-firenet-installer.exe
            asset_name: open-firenet-installer-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: open-firenet-installer
            asset_name: open-firenet-installer-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: open-firenet-installer
            asset_name: open-firenet-installer-macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "Synchronizing project versions to $TAG_VER from tag $GITHUB_REF_NAME"
          node -e "
            const fs = require('fs');
            for (const f of ['package.json', 'src-tauri/tauri.conf.json']) {
              if (fs.existsSync(f)) {
                const data = JSON.parse(fs.readFileSync(f, 'utf8'));
                data.version = '$TAG_VER';
                fs.writeFileSync(f, JSON.stringify(data, null, 2) + '\n');
              }
            }
            const cargoPath = 'src-tauri/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            const updated = cargo.replace(/^version\s*=\s*\"[^\"]+\"/m, 'version = \"$TAG_VER\"');
            fs.writeFileSync(cargoPath, updated);
          "

      - name: Build Frontend
        run: npm run build

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev pkg-config librsvg2-dev patchelf

      - name: Build release binary and packages (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          DISABLE_COPYRIGHT_FILES_DEPLOYMENT: '1'
        run: |
          npx tauri build --target ${{ matrix.target }} --bundles deb,appimage

      - name: Build release binary (Non-Linux)
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release --target ${{ matrix.target }}

      # Validation stricte des binaires et paquets (Smoke Tests)
      - name: Validate Linux Binary and Packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          test -f "$BIN" || { echo "::error::Binary not found at $BIN"; exit 1; }
          SIZE=$(stat -c%s "$BIN")
          echo "Binary size: $SIZE bytes"
          test "$SIZE" -ge 2000000 || { echo "::error::Binary abnormally small ($SIZE bytes)"; exit 1; }
          file "$BIN" | grep -E "ELF 64-bit.*x86-64" || { echo "::error::Invalid ELF format"; exit 1; }
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" --help

          APPIMAGE=$(find target/${{ matrix.target }}/release/bundle/appimage -name "*.AppImage" | head -n 1)
          test -f "$APPIMAGE" || { echo "::error::AppImage not found"; exit 1; }
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract-and-run --version

          DEB=$(find target/${{ matrix.target }}/release/bundle/deb -name "*.deb" | head -n 1)
          test -f "$DEB" || { echo "::error::DEB not found"; exit 1; }
          dpkg-deb -I "$DEB"

      - name: Validate Windows Binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          if (-not (Test-Path $bin)) { throw "Binary not found at $bin" }
          $size = (Get-Item $bin).Length
          Write-Host "Binary size: $size bytes"
          if ($size -lt 2000000) { throw "Binary abnormally small ($size bytes)" }
          & .\$bin --version
          & .\$bin --help

      - name: Validate macOS Binary
        if: startsWith(matrix.os, 'macos')
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          test -f "$BIN" || { echo "::error::Binary not found at $BIN"; exit 1; }
          SIZE=$(stat -f%z "$BIN")
          echo "Binary size: $SIZE bytes"
          test "$SIZE" -ge 2000000 || { echo "::error::Binary abnormally small ($SIZE bytes)"; exit 1; }
          file "$BIN" | grep -i "Mach-O" || { echo "::error::Invalid Mach-O format"; exit 1; }
          chmod +x "$BIN"
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            "$BIN" --version
          elif [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            # Cross-compiled on the arm64 runner; run through Rosetta 2 (preinstalled
            # on GitHub-hosted macOS runners) since there's no native x86_64 runner left.
            arch -x86_64 "$BIN" --version
          fi

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "release-dist/${{ matrix.asset_name }}"
          chmod +x "release-dist/${{ matrix.asset_name }}" || true
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            APPIMAGE=$(find target/${{ matrix.target }}/release/bundle/appimage -name "*.AppImage" | head -n 1)
            if [ -n "$APPIMAGE" ]; then
              cp "$APPIMAGE" "release-dist/open-firenet-installer-linux-x86_64.AppImage"
              chmod +x "release-dist/open-firenet-installer-linux-x86_64.AppImage"
            fi
            DEB=$(find target/${{ matrix.target }}/release/bundle/deb -name "*.deb" | head -n 1)
            if [ -n "$DEB" ]; then
              cp "$DEB" "release-dist/open-firenet-installer-linux-amd64.deb"
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release-dist/

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist

      - name: Flatten directory and compute checksums
        run: |
          # Each artifact is a directory named after the asset, containing a single
          # file with that SAME name (upload used name == path's basename). Moving
          # it "up" one level collides with its own still-there parent directory
          # (mv treats the existing same-named dir as a move-into target, so the
          # file lands right back where it started) -- so flatten via a separate
          # staging directory instead of moving files in place.
          mkdir flat-assets
          find release-dist -mindepth 2 -type f -exec cp -t flat-assets {} +
          rm -rf release-dist
          mv flat-assets release-dist
          cd release-dist
          shopt -s nullglob
          assets=(open-firenet-installer-*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No release assets found in release-dist after flattening"
            ls -la
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Install Minisign
        run: |
          curl -sL https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz | tar -xz -C /tmp/
          sudo cp /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          minisign -v

      - name: Sign Checksums with Minisign
        if: env.MINISIGN_SECRET_KEY != ''
        run: |
          if [[ "$MINISIGN_SECRET_KEY" != *"untrusted comment"* ]]; then
            printf "untrusted comment: minisign encrypted secret key\n%s\n" "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          else
            printf "%s\n" "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          fi
          minisign -S -m release-dist/SHA256SUMS -s /tmp/minisign.key -x release-dist/SHA256SUMS.minisig -t "Release ${{ github.ref_name }}" </dev/null
          rm -f /tmp/minisign.key
          if [ -f minisign.pub ]; then
            minisign -V -m release-dist/SHA256SUMS -p minisign.pub -x release-dist/SHA256SUMS.minisig
            echo "Minisign signature verified successfully."
          fi

      - name: Generate SLSA Build Attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-dist/open-firenet-installer-*
            release-dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-dist/open-firenet-installer-*
            release-dist/SHA256SUMS
            release-dist/SHA256SUMS.minisig
