name: CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-check:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

  rust-check:
    name: Rust Tests & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev pkg-config

      - name: Check code formatting
        run: cargo fmt --all -- --check || true

      - name: Run unit tests
        run: cargo test --verbose

  build-and-validate:
    name: Build & Smoke Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [frontend-check, rust-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: open-firenet-installer
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: open-firenet-installer.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: open-firenet-installer
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: open-firenet-installer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Frontend
        run: npm run build

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev pkg-config

      - name: Build binary (${{ matrix.target }})
        run: cargo build --release --target ${{ matrix.target }}

      # Validation approfondie des binaires produits (Sanity & Smoke Tests)
      - name: Validate Linux Binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          echo "=== 1. Vérification d'existence et de taille ==="
          test -f "$BIN" || { echo "::error::Binary not found at $BIN"; exit 1; }
          SIZE=$(stat -c%s "$BIN")
          echo "Binary size: $SIZE bytes"
          if [ "$SIZE" -lt 2000000 ]; then
            echo "::error::Binary abnormally small ($SIZE bytes)"
            exit 1
          fi

          echo "=== 2. Format ELF 64-bit ==="
          file "$BIN"
          file "$BIN" | grep -E "ELF 64-bit.*x86-64" || { echo "::error::Invalid ELF binary format"; exit 1; }

          echo "=== 3. Smoke Test (--version & --help) ==="
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" --help

          echo "=== 4. SHA256 Checksum ==="
          sha256sum "$BIN"

      - name: Validate Windows Binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          Write-Host "=== 1. Vérification d'existence et de taille ==="
          if (-not (Test-Path $bin)) { throw "Binary not found at $bin" }
          $size = (Get-Item $bin).Length
          Write-Host "Binary size: $size bytes"
          if ($size -lt 2000000) { throw "Binary abnormally small ($size bytes)" }

          Write-Host "=== 2. Smoke Test (--version & --help) ==="
          & .\$bin --version
          & .\$bin --help

          Write-Host "=== 3. SHA256 Checksum ==="
          Get-FileHash -Algorithm SHA256 $bin

      - name: Validate macOS Binary
        if: startsWith(matrix.os, 'macos')
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          echo "=== 1. Vérification d'existence et de taille ==="
          test -f "$BIN" || { echo "::error::Binary not found at $BIN"; exit 1; }
          SIZE=$(stat -f%z "$BIN")
          echo "Binary size: $SIZE bytes"
          if [ "$SIZE" -lt 2000000 ]; then
            echo "::error::Binary abnormally small ($SIZE bytes)"
            exit 1
          fi

          echo "=== 2. Format Mach-O ==="
          file "$BIN"
          file "$BIN" | grep -i "Mach-O" || { echo "::error::Invalid Mach-O binary format"; exit 1; }

          echo "=== 3. Smoke Test (--version & --help) ==="
          chmod +x "$BIN"
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ] && [ "${{ matrix.os }}" = "macos-latest" ]; then
            "$BIN" --version
            "$BIN" --help
          elif [ "${{ matrix.target }}" = "x86_64-apple-darwin" ] && [ "${{ matrix.os }}" = "macos-13" ]; then
            "$BIN" --version
            "$BIN" --help
          fi

          echo "=== 4. SHA256 Checksum ==="
          shasum -a 256 "$BIN"
