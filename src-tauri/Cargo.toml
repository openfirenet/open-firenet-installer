[package]
name = "open-firenet-installer"
version = "1.3.0"
edition = "2021"
authors = ["Open-Firenet Community"]
description = "Cross-platform GUI & CLI installer, flasher, and OTA updater for Open-Firenet"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ureq = { version = "2.10", features = ["json", "tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
dialoguer = "0.11"
colored = "2.1"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
serialport = "4.3"
minisign-verify = "0.2.5"
md-5 = "0.11.0"
